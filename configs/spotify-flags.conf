# Flags for the Spotify desktop client (read by /usr/bin/spotify).
#
# Why this is here: Spotify is bundled with Chromium, and on this machine
# Chromium's device scale factor comes out at 2.0736 - it multiplies
#   panel DPI heuristic (1920x1080 on a 310x170 mm, ~158 DPI panel => 1.6589)
#   x compositor scale (Hyprland eDP-1 scale = 1.25)
# At 2.07x Spotify lays out at ~663x470 CSS px inside a 1100x780 window, so the
# UI renders oversized and controls fall outside the viewport.
#
# --force-device-scale-factor MULTIPLIES that 2.0736, so the value below
# compensates for the DPI heuristic and leaves exactly the compositor's 1.25:
#   2.0736 x 0.60282 = 1.2500  =>  1 CSS px = 1 logical px (crisp, full UI)
# If you change the monitor scale, re-derive: 1 / 1.6589 = 0.60282.
--force-device-scale-factor=0.60282
